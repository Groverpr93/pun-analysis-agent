packages:
  - "frontend"
  - "backend"
  - "packages/timeouts"
allowBuilds:
  # Its postinstall writes Firebase web-app config for Firebase App Hosting's
  # auto-init. It arrives through firebase-admin, which doesn't use that.
  '@firebase/util': false
  # Its postinstall runs `lefthook install`, registering the git hooks in
  # lefthook.yml, so contributors get them from `pnpm install` with no extra
  # step. It skips itself when CI is set and ignores lefthook's exit code, so
  # the backend Docker build (`pnpm install --filter backend`, no .git) just
  # logs a "not a git repository" error and carries on. A root "prepare"
  # script running `lefthook install` would fail that build instead.
  lefthook: true
  # protobufjs is a transitive dep of genkit's OpenTelemetry plumbing, not
  # something our code calls directly — its postinstall/build step isn't
  # needed for the published package to work as a dependency, so left
  # disallowed rather than running untrusted install scripts on trust alone.
  protobufjs: false
ignoredOptionalDependencies:
  # An optional dependency of @genkit-ai/core that pulls in firebase-admin,
  # googleapis and Google Cloud telemetry exporters (~430MB of the backend's
  # ~610MB production node_modules). The backend uses neither Genkit's
  # Firebase integration nor Cloud telemetry, and Genkit only loads it when
  # present, so skipping it keeps the Cloud Run image (and every cold start)
  # much smaller. Verified by running the server from the resulting
  # production tree (TASK-13). firebase-admin itself is now a direct
  # dependency, for App Check (TASK-25), minus the two entries below.
  - "@genkit-ai/firebase"
  # Optional dependencies of firebase-admin (with google-gax and gRPC behind
  # them). The backend only uses firebase-admin/app-check, which never loads
  # either, and firebase-admin only needs them for getFirestore()/getStorage().
  - "@google-cloud/firestore"
  - "@google-cloud/storage"
overrides:
  # Pins @dotenvx/dotenvx's transitive systeminformation dependency to a
  # release old enough to clear pnpm's minimumReleaseAge supply-chain
  # policy — 5.33.13 was published hours before a CI run and got rejected.
  systeminformation: 5.33.12
