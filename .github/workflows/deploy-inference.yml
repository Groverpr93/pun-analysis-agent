name: Deploy Inference

# Pull requests only build the image, so a broken Dockerfile fails the PR
# instead of the deploy. Pushes to main (or a manual run on main) also run the
# inference tests, push the image to Artifact Registry, deploy it to Cloud Run
# and smoke-test it. The service is private: Backend's runtime service account
# is the only identity granted roles/run.invoker on it (project-level admins,
# including this workflow's deployer, can invoke it too). The Cloud Run setup
# (runtime service account, invoker grant, image repo) is documented in
# docs/local-setup.md.
#
# tests/ and scripts/ aren't in the image (inference/.dockerignore), but they
# match inference/**, so a test-only change redeploys an identical image.
# Accepted: it costs one build and one cold start.

on:
  push:
    branches: [main]
    paths:
      - "inference/**"
      - ".github/workflows/deploy-inference.yml"
  pull_request:
    paths:
      - "inference/**"
      - ".github/workflows/deploy-inference.yml"
  workflow_dispatch:

permissions:
  contents: read

# Deploys run one at a time, so an older commit can't finish last and end up
# serving. A newer push replaces a run still waiting, so the newest commit wins.
concurrency:
  group: deploy-inference-${{ github.ref }}
  cancel-in-progress: false

env:
  PROJECT_ID: pun-agent
  REGION: us-east1
  SERVICE: pun-agent-inference
  # Only main is ever deployed, even for a manual run on another branch.
  DEPLOY: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}

jobs:
  # test.yml already covers pull requests; this gates the deploy itself.
  test:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/test-python.yml

  build-and-deploy:
    name: Build image (and deploy on main)
    needs: test
    # Runs when the test job passed, or was skipped on a pull request.
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: echo "IMAGE=${REGION}-docker.pkg.dev/${PROJECT_ID}/pun-agent/inference" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v4

      - if: env.DEPLOY == 'true'
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - if: env.DEPLOY == 'true'
        uses: google-github-actions/setup-gcloud@v3
      - if: env.DEPLOY == 'true'
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - uses: docker/build-push-action@v7
        with:
          context: inference
          push: ${{ env.DEPLOY == 'true' }}
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=inference
          cache-to: type=gha,scope=inference,mode=max

      - if: env.DEPLOY == 'true'
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          service: ${{ env.SERVICE }}
          region: ${{ env.REGION }}
          image: ${{ env.IMAGE }}:${{ github.sha }}
          # Private: Cloud Run itself rejects callers without roles/run.invoker.
          # --no-allow-unauthenticated removes any allUsers grant, and
          # --invoker-iam-check turns the check back on if someone disabled it.
          # The runtime service account holds no roles, since Inference's data
          # is baked into the image. One instance, scaled to zero when idle.
          flags: >-
            --service-account=pun-agent-inference@${{ env.PROJECT_ID }}.iam.gserviceaccount.com
            --no-allow-unauthenticated
            --invoker-iam-check
            --min-instances=0
            --max-instances=1

      # Backend calls /analyze as its runtime service account, so it depends on
      # this grant on Inference's service. Applied on every deploy (a no-op
      # once present) so a recreated service or a grant removed by hand is
      # restored, instead of every Backend call quietly degrading to the
      # undetermined result.
      - if: env.DEPLOY == 'true'
        name: Let Backend's runtime service account invoke the service
        run: |
          gcloud run services add-iam-policy-binding "$SERVICE" \
            --project="$PROJECT_ID" --region="$REGION" \
            --member="serviceAccount:pun-agent-runtime@${PROJECT_ID}.iam.gserviceaccount.com" \
            --role=roles/run.invoker --format=none

      # The deploy flags should make this a 403 already, but gcloud only warns
      # if it fails to remove an allUsers grant, so the deploy alone doesn't
      # prove the service is private.
      - if: env.DEPLOY == 'true'
        name: Smoke-test that an unauthenticated request is refused
        run: |
          status=$(curl --silent --output /dev/null --write-out '%{http_code}' "$URL/openapi.json")
          if [ "$status" != 403 ]; then
            echo "::error::An unauthenticated request returned $status, expected 403"
            exit 1
          fi
        env:
          URL: ${{ steps.deploy.outputs.url }}

      # The deployer can invoke the service through its project-level
      # roles/run.admin. /openapi.json rather than /analyze, which answers 500
      # until the classifier lands (TASK-16).
      - if: env.DEPLOY == 'true'
        name: Smoke-test the deployed service with an ID token
        run: |
          token=$(gcloud auth print-identity-token --audiences="$URL")
          curl --fail --silent --show-error --output /dev/null \
            -H "Authorization: Bearer $token" "$URL/openapi.json"
        env:
          URL: ${{ steps.deploy.outputs.url }}
