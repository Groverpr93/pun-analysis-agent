name: Test inference

# The one definition of how inference/ is tested. test.yml calls it for every
# push and pull request; deploy-inference.yml calls it to gate its deploy, so
# a failing test never ships even though test.yml runs separately.
#
# A change here moves the deploy gate too. It isn't a deploy trigger (it
# doesn't change what ships); test.yml runs it on every pull request.

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Pytest (inference)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: inference
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked
      - run: uv run python -m wn download oewn:2025
      - run: uv run pytest
