name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-js:
    name: JS (${{ matrix.package }})
    strategy:
      matrix:
        include:
          # The frontend build (tsc -b && vite build) only runs at deploy time
          # otherwise, so build it here to catch type and build errors in the
          # PR. VITE_CHAT_ADAPTER is unset, so this builds the stub.
          - package: frontend
            build: true
          # deploy-backend.yml's image build already compiles the backend on
          # every pull request that touches it.
          - package: backend
            build: false
    uses: ./.github/workflows/test-js.yml
    with:
      package: ${{ matrix.package }}
      build: ${{ matrix.build }}

  test-python:
    name: Pytest (inference)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - working-directory: inference
        run: uv sync --locked
      - working-directory: inference
        run: uv run python -m wn download oewn:2025
      - working-directory: inference
        run: uv run pytest

  test-eval:
    name: Unittest (eval)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - working-directory: eval
        run: uv sync --locked
      - working-directory: eval
        run: uv run python -m unittest discover -s tests
